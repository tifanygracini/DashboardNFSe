[project]
name = "nfse-dashboard"
version = "0.4.0"
description = "Robô do ADN (NFS-e nacional) para todas as empresas do escritório + importador PostgreSQL + painel web"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0",
    "requests>=2.31",
    "requests-pkcs12>=1.22",
    "pandas>=2.2",
    "plotly>=5.20",
    "psycopg[binary]>=3.2",
    "cryptography>=42",   # lê CNPJ e validade dos certificados A1
]

[project.optional-dependencies]
keyring = ["keyring>=25"]
dev = ["pytest>=8", "httpx2>=2.16"]  # httpx2: exigido pelo TestClient do Starlette
# interface web (FastAPI) com o login do Portal Informe; informe-auth vem do repositório informe-portal
web = ["informe-auth", "uvicorn[standard]>=0.30"]

[project.scripts]
nfse-baixar = "nfse.cli.baixar:main"
nfse-importar = "nfse.cli.importar:main"
nfse-empresas = "nfse.cli.empresas:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nfse = ["web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
