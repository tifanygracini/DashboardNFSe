[project]
name = "nfse-dashboard"
version = "0.3.0"
description = "Robô do ADN (NFS-e nacional) + importador PostgreSQL + dashboard (FastAPI e Streamlit)"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0",
    "requests>=2.31",
    "requests-pkcs12>=1.22",
    "pandas>=2.2",
    "plotly>=5.20",
    "streamlit>=1.46",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
keyring = ["keyring>=25"]
dev = ["pytest>=8", "httpx>=0.27"]
# interface web (FastAPI) com o login do Portal Informe; informe-auth vem do repositório informe-portal
web = ["informe-auth", "uvicorn[standard]>=0.30"]

[project.scripts]
nfse-baixar = "nfse.cli.baixar:main"
nfse-importar = "nfse.cli.importar:main"
nfse-dashboard = "nfse.cli.dashboard:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nfse = ["web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
